basePath: /api
definitions:
  apihelpers.ApiRes:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
  models.Document:
    properties:
      created_at:
        type: string
      extracted_content:
        type: string
      id:
        type: string
      mime_type:
        type: string
      name:
        type: string
      path:
        type: string
      rejection_reason:
        type: string
      size:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Document Management Service API with PostgreSQL, Redis, and Cassandra
    datastores.
  title: Doc Manager API
  version: "1.0"
paths:
  /documents:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a file (CSV, PDF, etc.) with metadata, stores record in
        DB as 'uploaded', and starts async background processing
      parameters:
      - description: Document file to upload
        in: formData
        name: file
        required: true
        type: file
      - description: MIME type or file format (e.g. pdf, csv)
        in: formData
        name: typeOfFile
        type: string
      - description: Optional metadata in JSON or plain text format
        in: formData
        name: optionalMeta
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Document accepted successfully
          schema:
            allOf:
            - $ref: '#/definitions/apihelpers.ApiRes'
            - properties:
                data:
                  $ref: '#/definitions/models.Document'
              type: object
        "400":
          description: Missing file or invalid parameters
          schema:
            $ref: '#/definitions/apihelpers.ApiRes'
        "500":
          description: Server or database error
          schema:
            $ref: '#/definitions/apihelpers.ApiRes'
      summary: Upload and accept a document
      tags:
      - documents
swagger: "2.0"
